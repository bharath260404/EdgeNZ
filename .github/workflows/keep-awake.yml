# Render's free server sleeps after 15 minutes without visitors and
# then takes about a minute to wake. Staff use the portal during the
# school day, so keep it awake from 6:30 am to 6:30 pm IST, Mon to Sat.
name: Keep the API awake

on:
  schedule:
    - cron: "*/10 1-12 * * 1-6"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --silent --show-error --max-time 120 --output /dev/null https://callroll-api.onrender.com/
